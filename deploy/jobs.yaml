# Toolforge jobs framework: toolforge jobs load deploy/jobs.yaml
# Assumes the repo is checked out at ~/parambot with a venv at ~/parambot/venv,
# and user-config.py / user-password.py (and parambot.toml, for any settings) in ~/parambot.
- name: parambot
  # Reporting only until the BRFA is approved: it saves User:ParamBot/Report and
  # edits nothing else, and User:ParamBot/Run can say "report". Once approved,
  # change --report-only to --live, and the Run page to "yes". (Or drop
  # --report-only and set mode in parambot.toml: the command line wins over it.)
  command: cd $HOME/parambot && PYWIKIBOT_DIR=$HOME/parambot ./venv/bin/python -m parambot run --report-only
  image: python3.13
  # Toolforge picks the time of day. Quoted: YAML can't start a bare value with @.
  schedule: "@daily"
  emails: onfailure
