name: CI

# Every push to any branch, every pull request, and by hand from the Actions tab.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The tests never touch a wiki, so Pywikibot needs no user-config.py.
  PYWIKIBOT_NO_USER_CONFIG: "2"
  # mwparserfromhell has no ready-built package for every Python version.
  # If its C extension won't compile, use its pure-Python parser instead
  # of failing the install.
  WITH_EXTENSION: optional
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check --output-format=github .
      - name: Type-check
        run: mypy

  test:
    name: Tests, Python ${{ matrix.python }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Toolforge runs the bot with 3.13 (deploy/jobs.yaml); tests/test_deploy.py
        # checks that it stays in this list.
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # The operators develop on Windows.
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: coverage run -m pytest
      - name: Coverage
        # Fails below fail_under in pyproject.toml.
        run: coverage report
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  oldest:
    name: Tests, oldest supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the lowest versions pyproject.toml allows
        run: pip install -e ".[dev]" "pywikibot==11.0.0" "mwparserfromhell==0.7.2"
      - name: Test
        run: pytest

  package:
    name: Package builds, installs and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Install the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
      - name: Run it from outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/parambot" --help
          "$RUNNER_TEMP/venv/bin/python" -m parambot run --help
          # Pywikibot reads its configuration when it's first imported, so
          # the command line mustn't import it before it's ready.
          "$RUNNER_TEMP/venv/bin/python" -c "import sys, parambot.cli; sys.exit('pywikibot' in sys.modules)"
