name: Tests

# Every push to any branch, and every pull request.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      # The tests never touch a wiki, so Pywikibot needs no user-config.py.
      PYWIKIBOT_NO_USER_CONFIG: "2"
      # mwparserfromhell has no ready-built package for every Python version.
      # If its C extension won't compile, use its pure-Python parser instead
      # of failing the install.
      WITH_EXTENSION: optional
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest
