name: Live

# Read-only checks against the real English Wikipedia (tests/test_live.py),
# which catch changes on the wiki's side that the fake wiki in the other
# tests can't: by hand from the Actions tab, and once a week. They read a
# few dozen pages, at least a second apart, and never edit.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"   # Mondays, 07:23 UTC

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  live:
    name: Against en.wikipedia.org
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The version Toolforge runs the bot with.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test against the real wiki
        run: pytest -m live -v
