[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parambot"
version = "0.1.0"
description = "Wikipedia bot that fixes deprecated template parameters restored after a cleanup run"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # From 11.0, every request waits out a Retry-After from Wikimedia, not
    # only those made when the servers are lagged.
    "pywikibot>=11.0",
    # 0.7.2: what Pywikibot 11.0 needs anyway.
    "mwparserfromhell>=0.7.2",
]

[project.optional-dependencies]
# PyYAML is only for the test that checks deploy/jobs.yaml.
dev = ["pytest", "ruff", "mypy", "coverage>=7.2", "pyyaml"]

[project.scripts]
parambot = "parambot.cli:main"

[tool.setuptools]
packages = ["parambot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The live tests read the real Wikipedia, so they only run when asked for,
# with: pytest -m live
addopts = "-m 'not live'"
markers = ["live: reads the real English Wikipedia (never edits); run with -m live"]

[tool.coverage.run]
branch = true
source = ["parambot"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "B",        # bugbear
    "I",        # import order
    "UP",       # modern syntax for the supported Python versions
    "SIM",      # simplifications
    "C90",      # complexity
]
ignore = [
    "SIM905",   # word lists written as '''...'''.split() read better than long list literals
]

[tool.ruff.lint.per-file-ignores]
# Pywikibot provides `usernames` when it runs a user-config.py.
"deploy/user-config.example.py" = ["F821"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
files = ["parambot"]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["pywikibot", "pywikibot.*"]   # ships no type information
ignore_missing_imports = true
